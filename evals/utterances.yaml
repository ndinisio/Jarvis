# Understanding corpus: how JARVIS should read what people actually say.
#
# mode:  act | chat — should JARVIS do something on the computer, or talk?
# quick: what the deterministic fast path (router/quick.py) must do with it:
#          <name>  → must match exactly this tool/capability/control
#          none    → must NOT quick-match (a regex would get it wrong)
#          omitted → no expectation (either is acceptable)
# norm:  the deterministic tool the request should reach once the Interpreter
#        (v3.0 Phase 3) has normalised the colloquial phrasing.

groups:
  - name: exact commands
    mode: act
    tags: [exact]
    utterances:
      - {t: "what time is it", quick: get_time}
      - {t: "What's the time?", quick: get_time}
