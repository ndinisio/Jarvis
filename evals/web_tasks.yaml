# End-to-end web tasks against the mock sites (evals/mock_sites).
#
# Each task: several natural phrasings a person might actually say, the
# ground-truth checks that define success (evals/checks.py), and an oracle
# recipe (evals/oracle.py) — the semantic steps a competent model would take,
# which the oracle must ground in what JARVIS actually shows it.
#
# approve: fragments of a confirmation prompt the simulated user says yes to.
# Consequential confirmations not listed are declined.
# target_phase: the v3.0 phase expected to make the task pass.

tasks:
  # ------------------------------------------------------------------ shopping
  - id: shop-usb-cable
    category: shop
    understood: {site: amazon.co.uk, targets: [usb c cable], surface: web}
    phrasings:
      - Search for a USB-C cable on Amazon and add it to my basket
      - can you find me a usb c cable on amazon and pop it in my basket
      - I need a USB-C charging cable from Amazon, stick one in the basket
    checks:
      - basket_has_any: [{asin: B0CABLE2M1}, {asin: B0CABLE1M2}]
      - no_orders: true
      - no_checkout: true
    oracle:
      - go: https://www.amazon.co.uk/s?k=usb+c+cable
      - click: Anker USB-C to USB-C Cable
      - click: Add to Basket

  - id: shop-aa-batteries
