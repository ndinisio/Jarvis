      - basket_has_any: [{asin: B0AABAT24A}, {asin: B0AABAT08B}, {asin: B0AABAT48C}]
      - no_orders: true
    oracle:
      - go: https://www.amazon.co.uk/s?k=aa+batteries
      - click: Duracell Plus AA Batteries
      - click: Add to Basket

