  # ------------------------------------------------------------------ single-page app
  - id: spa-add-milk
    category: spa
    phrasings:
      - add milk to my groceries list on tasks.example.com
      - on my tasks app, put milk on the groceries list
    checks:
      - task_item: {list: Groceries, text_contains: milk}
    oracle:
      - go: https://tasks.example.com/
      - fill: Add an item
        text: Milk
      - click: Add
        role: button

  - id: spa-add-two
    category: spa
    phrasings:
      - add butter and jam to my groceries list on tasks.example.com
    checks:
      - task_item: {list: Groceries, text_contains: butter}
      - task_item: {list: Groceries, text_contains: jam}
    oracle:
      - go: https://tasks.example.com/
      - fill: Add an item
        text: Butter
      - click: Add
        role: button
      - fill: Add an item
        text: Jam
      - click: Add
        role: button

  - id: spa-new-list
    category: spa
    phrasings:
      - create a new list called Holiday in my tasks app at tasks.example.com
    checks:
      - list_exists: Holiday
    oracle:
      - go: https://tasks.example.com/
      - fill: New list name
        text: Holiday
      - click: Create list

  - id: spa-mark-done
    category: spa
    target_phase: 4
    phrasings:
      - on tasks.example.com tick off "Send the invoice" on my work list
    checks:
      - task_item: {list: Work, text_contains: invoice, done: true}
    oracle:
      - go: https://tasks.example.com/#/list/Work
      - click: Send the invoice
        role: checkbox

  - id: spa-share-shadow
    category: spa
    target_phase: 4
    phrasings:
      - share my groceries list on tasks.example.com with bob.martin@example.com
    checks:
      - shared: {list: Groceries, email: bob.martin@example.com}
    oracle:
      - go: https://tasks.example.com/
      - fill: Share with
        text: bob.martin@example.com
      - click: Share list

  - id: spa-feedback-iframe
    category: spa
    target_phase: 4
    # Sending is always confirmed; the simulated user says yes.
    approve: [Send]
    phrasings:
      - send feedback on tasks.example.com saying great app
    checks:
      - feedback_contains: great app
    oracle:
      - go: https://tasks.example.com/
      - fill: Tell us what you think
        text: Great app
      - click: Send feedback

  - id: spa-scroll-save-talk
    category: spa
    target_phase: 4
    phrasings:
      - on events.example.com/talks save the soldering for beginners talk
      - bookmark the Soldering for Beginners session in the makers meetup talks list
    # A newsletter pop-up swallows clicks until dismissed, and the talk only
    # loads once the list has been scrolled twice.
    checks:
      - talk_saved: Soldering for Beginners
    oracle:
      - go: https://events.example.com/talks
      - key: escape
      - scroll: down
        until: Save Soldering for Beginners
      - click: Save Soldering for Beginners

