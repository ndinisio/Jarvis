      - click: Anker USB-C to USB-C Cable
      - click: Add to Basket

  - id: shop-remove-kettle
    category: shop
    setup:
      amazon:
        cookies: accepted
        cart:
          - {asin: B0KETTLE17, qty: 1, variant: Black}
          - {asin: B0CABLE2M1, qty: 1}
    phrasings:
      - remove the kettle from my amazon basket
      - actually I don't want the kettle any more, take it out of my Amazon basket
    checks:
      - basket_lacks: {asin: B0KETTLE17}
      - basket_has: {asin: B0CABLE2M1}
    oracle:
      - go: https://www.amazon.co.uk/gp/cart/view.html
      - click: Delete Russell Hobbs
    # The remove control is labelled "Delete", which (correctly) always asks.
    approve: [Delete]

  - id: shop-deals
    category: nav
    phrasings:
      - show me today's deals on amazon
      - pull up Amazon's deals page
    checks:
      - visited: ["/deals", "/b?node=1"]
    oracle:
      - go: https://www.amazon.co.uk/deals

  - id: shop-open-basket
    category: nav
    phrasings:
