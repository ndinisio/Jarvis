[project]
name = "jarvis-assistant"
version = "3.0.dev7"
description = "JARVIS — a local-first, voice-driven AI operating layer for macOS"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    # Skill recipes (backend/jarvis/skills/builtin/*.yaml).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
voice = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "faster-whisper>=1.0.0",
    "openwakeword>=0.6.0",
]
# Whisper large-v3-turbo on the Apple Silicon GPU (voice/stt.py: MLXWhisperSTT),
# picked automatically by stt_engine="auto" when installed.
mlx = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Local neural TTS (voice/tts.py: KokoroTTS). Needs the `voice` extras too,
# for sounddevice playback — not repeated here, install both together.
kokoro = [
    "kokoro-onnx>=0.4.0",
]
# Genuine scroll-wheel event synthesis (tools/interaction/scroll_quartz.py).
# macOS only, and optional — ScrollTool falls back to its key-based path
# without it.
scroll = [
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]
# Mac apps as a surface (surfaces/native/): the Accessibility tree, genuine
# key and mouse events, on-device text recognition, and the numbered-marks
# overlay. setup.sh installs it on macOS; without it the app tools fall back
# to AppleScript.
native = [
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pillow>=10.1",
]
# JARVIS's own browser, driven over the DevTools protocol (surfaces/web/cdp.py).
browser = [
    "playwright>=1.45",
]
# The evaluation harness (evals/): suites are YAML; web tasks need `browser`.
evals = [
    "pyyaml>=6.0",
    "playwright>=1.45",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["jarvis*"]

# Recipes and knowledge packs ship inside the package.
[tool.setuptools.package-data]
"jarvis.skills" = ["builtin/*.yaml", "knowledge/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# A deliberate baseline rather than everything ruff knows: correctness,
# imports and modernisation. Broad `except` clauses are used on purpose at
# subsystem boundaries (a failing tool must never take down a turn), and local
# time is what a desktop assistant means by "now", so those rules stay off.
select = ["E", "F", "I", "UP", "W", "RUF100", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
